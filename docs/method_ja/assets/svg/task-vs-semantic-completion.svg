<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">タスク完了と意味完了の違い</title>
  <desc id="desc">タスク完了が実装、テスト、レビュー、Doneを示す一方で、意味完了は意図、制約、未解決性、責任、次回更新方針の引き渡しを必要とすることを示す図。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#222" />
    </marker>
    <style>
      .box { fill: #fff; stroke: #222; stroke-width: 2; rx: 14; }
      .sem { fill: #f7fbf9; stroke: #1f4f46; stroke-width: 2; rx: 14; }
      .label { font-family: sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
      .small { font-family: sans-serif; font-size: 13px; fill: #222; }
      .note { font-family: sans-serif; font-size: 14px; fill: #111; }
      .arrow { stroke: #222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="560" y="34" text-anchor="middle" class="label">Done は必ずしも意味完了ではない</text>

  <rect x="70" y="90" width="200" height="76" class="box" />
  <text x="170" y="122" text-anchor="middle" class="label">実装</text>
  <text x="170" y="148" text-anchor="middle" class="small">コードができる</text>

  <rect x="320" y="90" width="200" height="76" class="box" />
  <text x="420" y="122" text-anchor="middle" class="label">テスト</text>
  <text x="420" y="148" text-anchor="middle" class="small">動作を確認</text>

  <rect x="570" y="90" width="200" height="76" class="box" />
  <text x="670" y="122" text-anchor="middle" class="label">レビュー</text>
  <text x="670" y="148" text-anchor="middle" class="small">品質を確認</text>

  <rect x="820" y="90" width="200" height="76" class="box" />
  <text x="920" y="122" text-anchor="middle" class="label">Done</text>
  <text x="920" y="148" text-anchor="middle" class="small">作業状態の完了</text>

  <path d="M275 128 L315 128" class="arrow" />
  <path d="M525 128 L565 128" class="arrow" />
  <path d="M775 128 L815 128" class="arrow" />

  <rect x="115" y="240" width="190" height="78" class="sem" />
  <text x="210" y="272" text-anchor="middle" class="label">意図</text>
  <text x="210" y="298" text-anchor="middle" class="small">何を守るか</text>

  <rect x="340" y="240" width="190" height="78" class="sem" />
  <text x="435" y="272" text-anchor="middle" class="label">未解決性</text>
  <text x="435" y="298" text-anchor="middle" class="small">何を残すか</text>

  <rect x="565" y="240" width="190" height="78" class="sem" />
  <text x="660" y="272" text-anchor="middle" class="label">責任</text>
  <text x="660" y="298" text-anchor="middle" class="small">誰が引き受けるか</text>

  <rect x="790" y="240" width="210" height="78" class="sem" />
  <text x="895" y="272" text-anchor="middle" class="label">次回更新方針</text>
  <text x="895" y="298" text-anchor="middle" class="small">何を引き継ぐか</text>

  <path d="M920 170 C885 210, 860 220, 895 236" class="arrow" />
  <path d="M305 279 L335 279" class="arrow" />
  <path d="M530 279 L560 279" class="arrow" />
  <path d="M755 279 L785 279" class="arrow" />

  <text x="560" y="382" text-anchor="middle" class="note">印刷用代替説明: 上段は作業状態の完了、下段は意味完了に必要な確認を示す。Done の後にも、意図・未解決性・責任・次回更新方針の引き渡しが必要である。</text>
</svg>
